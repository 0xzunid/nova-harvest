<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="NOVA HARVEST — a neon arcade space harvester. Fly Lumen, collect starshards, blast void mites.">
<title>NOVA HARVEST — Harvest the dying light.</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060f; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: 100vw; height: 100vh; display: block;
    touch-action: none; cursor: crosshair;
    background: #05060f;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="NOVA HARVEST: fly the harvester ship Lumen, collect starshards and shoot void mites"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
